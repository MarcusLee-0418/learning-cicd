name: 🚀 CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  greet:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 👋 Say Hello
        run: |
          echo "Hello from GitHub Actions! 🎉"
          echo "Today is $(date)"

  build:
    runs-on: ubuntu-latest
    needs: greet
    steps:
      - uses: actions/checkout@v4
      - name: 🔧 Build Info
        run: |
          python3 --version
          git --version
          echo "Build complete!"

  validate:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: ✅ Validate files
        run: |
          if [ -f "hello.txt" ]; then cat hello.txt; fi
          if [ -f "health-check.py" ]; then echo "✅ health-check.py exists"; fi
          echo "✅ Validation passed!"

  health-check:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - name: 🏥 Run health check
        run: python3 health-check.py

      - name: 📤 Upload report
        uses: actions/upload-artifact@v4
        with:
          name: health-report
          path: health-report.json

  deploy:
    runs-on: ubuntu-latest
    needs: health-check
    if: github.ref == 'refs/heads/main'
    steps:
      - name: 🚀 Deploy (simulated)
        run: echo "✅ Deployed to production!"
