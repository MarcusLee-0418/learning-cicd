name: learn about my first pipeline
on:
  push:
    branches: [main]
jobs:
  health-check-job:
    runs-on: ubuntu-latest
    steps:
      - name: copy code
        uses: actions/checkout@v4
        
      - name: set python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: read secret key
        env:
          MY_API_KEY: ${{ secrets.MY_SECRET_KEY}}
        run: |
          echo "extracting my secret key..."
          echo "my secret key is $MY_API_KEY"
      #- name: execute the health check script
      #  run: python3 healthCheck.py
  deploy-job:
    runs-on: ubuntu-latest
    needs: health-check-job
    steps:
      - name: deployment
        run: echo "all server is health! deploy to the environment successfully!"
