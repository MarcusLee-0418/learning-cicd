name: learn about my first pipeline
on:
  push:
    branches: [main]
jobs:
  test-job:
    runs-on: ubuntu-latest
    steps:
      - name: Run test
        run: echo "It is testing...passing test!"

  deploy-job:
    runs-on: ubuntu-latest
    needs: test-job
    steps:
      - name: Run deploy
        run: echo "Passing test! start to deploy in the server!"
