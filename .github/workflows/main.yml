name: learn about my first pipeline
on:
  push:
    branches: [main]
jobs:
  health-check-job:
    runs-on: ubuntu-latest
    steps:
      - name: copy code
        uses: actions/checkout@v4
        
      - name: set python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: input the secret key
        env:
          SECRET_TOKEN: ${{ secrets.MY_SECRET_KEY}}
      - name: execute the health check script
        run: python3 healthCheck.py
  deploy-job:
    runs-on: ubuntu-latest
    needs: health-check-job
    steps:
      - name: deployment
        run: echo "all server is health! deploy to the environment successfully!"
