name: YAML Practice 3
on:
  push:
    branches: [main]

env:
  ProjectName: "My Web"

jobs:
  test-job:
    runs-on: ubuntu-latest
    steps:
      - run: echo "testing execution unit..."
  
  deploy-job:
    runs-on: ubuntu-latest
    needs: test-job
    steps:
      - name: step 1
        id: get_date
        run: echo "today=$(date+'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: step 2
        run: echo " deploy date is ${{ steps.get_date.outputs.today}}"
