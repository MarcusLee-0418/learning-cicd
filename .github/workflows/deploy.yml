name: automatically deploy webpage

on:
  push:
    branches: [main]
  # allow deployment manually
  workflow_dispatch:

# set the permission for Github Actions
permissions:
  contents: read
  pages: write
  id-token: write
# ensure only one deployment work as the same time
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{steps.deployment.outputs.page_url}}
    runs-on: ubuntu-latest

    steps:
      - name: copy code
        uses: actions/checkout@v4
            
      - name: initialise Github Pages environment
        uses: actions/configure-pages@v5

      - name: packing web file
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: publish
        id: deployment
        uses: actions/deploy-pages@v4
